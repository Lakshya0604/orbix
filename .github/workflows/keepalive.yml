name: keep-awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Orbix health endpoint
        run: curl -fsS --retry 3 --retry-delay 15 --max-time 90 https://orbix-3av3.onrender.com/api/health
