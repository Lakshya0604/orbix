name: keep-awake
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping Orbix health endpoint
        # Render free tier cold-starts slowly (30-60s+); --retry-all-errors also retries
        # HTTP 502/503 returned during spin-up. Worst case ~5min30s < timeout-minutes.
        run: curl -fsS --retry 5 --retry-delay 30 --retry-all-errors --max-time 330 https://orbix-3av3.onrender.com/api/health
